[project]
name = "dso-loader"
version = "0.1.0"
description = "Load all DSO content into Postgres+PostGIS — PoC Utrecht"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "lxml>=5.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "rich>=13.0",
    # De twee onderstaande zijn geen loader-afhankelijkheden maar sync-stappen:
    # zonder deze regels hangt de sync af van welke interpreter je toevallig
    # pakt, en dat brak op 2026-08-15 twee stappen ná elkaar.
    # - openpyxl: bouw_indeling.py leest de handcuratie uit curatie/lijsten.xlsx
    #   en stopt hard als hij ontbreekt (stap 1, fase_post).
    # - numpy: run_overnight.extend_categorie() rekent de nearest-centroide uit
    #   (stap 6a) — de stap die de nieuwe chunks hun onderwerp geeft.
    # - pyyaml: diff_lokaal_prod.py en diff_schema_lokaal_prod.py lezen
    #   scripts/diff_verwachtingen.yml (stap 7, de verificatie). Ontbrak hier tot
    #   2026-10-02, waardoor de hoofdcontrole van stap 7 op een verse venv omviel
    #   met ModuleNotFoundError — en "niet gedraaid" ziet er net zo groen uit als
    #   "0 afwijkingen".
    "openpyxl>=3.1",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.scripts]
dso-loader = "src.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
